global:
  pgDatabase: secretariat
  pgUser: secretariat

app:
  envFrom:
    - secretRef:
        name: app
  vars:
    NEXTAUTH_URL: https://{{ .Values.global.host }}
    HASURA_URL: http://hasura/v1/graphql
  probesPath: /healthz
  imagePackage: app

hasura:
  ~needs: [pg]
  annotations:
    "oblik.socialgouv.io/min-request-memory": 1Gi
    "oblik.socialgouv.io/min-request-cpu": 300m
  envFrom:
    - secretRef:
        name: hasura
    - secretRef:
        name: pg-app
    - configMapRef:
        name: hasura-configmap

pg:
  ~chart: pg
